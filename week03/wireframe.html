<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe</title>
    <meta name="author" content="Israel J. Betancourt">
    <meta name="description" content="This is my first wireframe">
    <link rel="stylesheet" href="styles/wireframe.css">
    <script src="scripts/footer.js" defer></script>
    <script src="scripts/data.js" defer></script>
    <script src="scripts/weather.js" defer></script>
</head>
<body>
    <header>
        <h1>Venezuela</h1>
    </header>
    <main>
        <section id="data-section">
            <h2>Data:</h2>
            <ul id="data-list">
                <li><strong>Area:</strong> <span id="area"></span></li>
                <li><strong>Population:</strong> <span id="population"></span></li>
                <li><strong>Capital:</strong> <span id="capital"></span></li>
                <li><strong>Languages:</strong> <span id="languages"></span></li>
                <li><strong>Currency:</strong> <span id="currency"></span></li>
                <li><strong>Time Zone:</strong> <span id="time-zone"></span></li>
                <li><strong>Calling Code:</strong> <span id="calling-code"></span></li>
                <li><strong>Internet TLD:</strong> <span id="internet-tld"></span></li>

           </ul>
        </section>

        <section id="weather-section">
            <h2>Weather:</h2>
            <ul id="weather-list">
                <li><strong>Temperature:</strong> <span id="temperature"></span></li>
                <li><strong>Conditions:</strong> <span id="conditions"></span></li>
                <li><strong>Wind:</strong> <span id="wind-speed"></span></li>
                <li><strong>Wind Chill:</strong> <span id="wind-chill"></span></li>
           </ul>
        </section>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> Israel J. Betancourt • Bolivar City / Venezuela</p>
        <p id="lastModified">Last Modification: </p>
    </footer>
</body>
</html>
